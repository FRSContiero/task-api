name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Repositorio criado no Windows pode perder a permissao de execucao do wrapper
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Check formatting
        run: ./mvnw -B spotless:check

      # Unitarios (surefire) + integracao com Testcontainers (failsafe)
      - name: Build and test
        run: ./mvnw -B verify
